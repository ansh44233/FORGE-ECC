name: FORGE Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (for example v1.0.0)"
        required: true
        default: "v1.0.0"
      target_ref:
        description: "Verified branch or commit to release"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  verify-and-release:
    name: Verify package and publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Pack distributable
        run: |
          mkdir -p release-assets
          npm pack --pack-destination release-assets
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: FORGE ${{ inputs.release_tag || github.ref_name }}
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ inputs.target_ref || github.sha }}
          body_path: CHANGELOG.md
          files: release-assets/*.tgz
          generate_release_notes: true
