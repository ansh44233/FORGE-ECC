name: FORGE CI

on:
  push:
    branches: [main, forge-v2, v3]
  pull_request:
    branches: [main, forge-v2, v3]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Generate dependency audit report
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-dependency-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: FORGE Shield self-scan
        run: |
          node dist/cli.js shield . --markdown >> "$GITHUB_STEP_SUMMARY"
          node dist/cli.js shield . --fail-on high
      - name: Pack and install CLI in a clean directory
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/forge-clean-install"
          npm install --prefix "$RUNNER_TEMP/forge-clean-install" "$RUNNER_TEMP"/forge-engineering-workbench-*.tgz
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" --version
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" --help
          mkdir -p "$RUNNER_TEMP/forge-smoke-project"
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" init "$RUNNER_TEMP/forge-smoke-project"
          "$RUNNER_TEMP/forge-clean-install/node_modules/.bin/forge" inspect "$RUNNER_TEMP/forge-smoke-project"

  docker-runtime:
    name: Real Docker sandbox integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Pull sandbox image and resolve immutable digest
        id: image
        shell: bash
        run: |
          docker pull node:22-alpine
          IMAGE_REF="$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')"
          if [[ -z "$IMAGE_REF" || "$IMAGE_REF" != *@sha256:* ]]; then
            echo "Could not resolve an immutable image digest" >&2
            exit 1
          fi
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
          docker info
      - name: Execute real container boundary tests
        env:
          FORGE_DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
          FORGE_HOST_SECRET_SENTINEL: must-not-enter-container
        run: npx vitest run tests/container-sandbox.integration.test.ts

