name: Rootless Docker sandbox integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-rootless-runtime:
    name: Rootless Docker sandbox integration
    # Configure a Linux self-hosted runner with rootless Docker and delegated cgroup v2.
    # Apply the custom "rootless-docker" runner label after validating that setup.
    runs-on: [self-hosted, linux, rootless-docker]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify rootless Docker and cgroup support
        shell: bash
        run: |
          docker info
          SECURITY_OPTIONS="$(docker info --format '{{json .SecurityOptions}}')"
          echo "$SECURITY_OPTIONS"
          if ! grep -q rootless <<< "$SECURITY_OPTIONS"; then
            echo "The configured Docker daemon is not reporting rootless mode." >&2
            exit 1
          fi
          CGROUP_VERSION="$(docker info --format '{{.CgroupVersion}}')"
          CGROUP_DRIVER="$(docker info --format '{{.CgroupDriver}}')"
          echo "Cgroup version: $CGROUP_VERSION; driver: $CGROUP_DRIVER"
          if [[ "$CGROUP_VERSION" != "2" ]]; then
            echo "Rootless sandbox validation requires cgroup v2." >&2
            exit 1
          fi
          if [[ "$CGROUP_DRIVER" != "systemd" ]]; then
            echo "Rootless sandbox validation requires the systemd cgroup driver with delegation." >&2
            exit 1
          fi
          docker run --rm --memory=128m --cpus=0.5 --pids-limit=64 node:22-alpine node -e "if (process.pid !== 1) process.exit(1)"
      - name: Install dependencies
        run: npm install
      - name: Pull sandbox image and resolve immutable digest
        id: image
        shell: bash
        run: |
          docker pull node:22-alpine
          IMAGE_REF="$(docker image inspect node:22-alpine --format '{{index .RepoDigests 0}}')"
          if [[ -z "$IMAGE_REF" || "$IMAGE_REF" != *@sha256:* ]]; then
            echo "Could not resolve an immutable image digest" >&2
            exit 1
          fi
          echo "ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"
      - name: Execute rootless container boundary tests
        env:
          FORGE_DOCKER_IMAGE: ${{ steps.image.outputs.ref }}
          FORGE_REQUIRE_ROOTLESS: "true"
          FORGE_HOST_SECRET_SENTINEL: must-not-enter-container
        run: npx vitest run tests/container-sandbox.integration.test.ts
